<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · Meus Arquivos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --verde: #46da86; --verde-hover: #35c473; --azul: #111741; --azul-escuro: #142037; --fundo: #f4f6f9; --borda: #e3e7ee; --texto-suave: #6b7489; --perigo: #e5484d; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', sans-serif; background: var(--fundo); color: var(--azul-escuro);
    min-height: 100vh; display: grid; place-items: center; padding: 16px;
  }
  .box {
    width: 100%; max-width: 400px; background: #fff; border-radius: 18px;
    box-shadow: 0 4px 24px rgba(17, 23, 65, .08); overflow: hidden;
  }
  .top { background: var(--azul-escuro); color: #fff; padding: 28px 28px 24px; text-align: center; }
  .logo { width: 52px; height: 52px; border-radius: 14px; background: var(--verde); color: var(--azul); display: grid; place-items: center; margin: 0 auto 12px; }
  .top h1 { font-size: 1.35rem; font-weight: 600; }
  .top h1 span { color: var(--verde); }
  .top p { font-size: .85rem; color: #aab3c8; margin-top: 2px; }
  form { padding: 28px; }
  label { display: block; font-size: .85rem; font-weight: 500; margin-bottom: 6px; color: var(--azul); }
  input {
    width: 100%; font-family: inherit; font-size: .95rem; padding: 12px 14px; margin-bottom: 18px;
    border: 1.5px solid var(--borda); border-radius: 10px; outline: none; transition: .15s; color: var(--azul-escuro);
  }
  input:focus { border-color: var(--verde); box-shadow: 0 0 0 3px rgba(70, 218, 134, .2); }
  button {
    width: 100%; font-family: inherit; font-size: 1rem; font-weight: 600; padding: 13px;
    border: none; border-radius: 10px; background: var(--verde); color: var(--azul); cursor: pointer; transition: .15s;
  }
  button:hover { background: var(--verde-hover); }
  button:disabled { opacity: .6; cursor: wait; }
  .erro { display: none; background: rgba(229, 72, 77, .1); color: var(--perigo); font-size: .85rem; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; }
  .erro.show { display: block; }
</style>
</head>
<body>
  <div class="box">
    <div class="top">
      <div class="logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </div>
      <h1>Meus <span>Arquivos</span></h1>
      <p>Entre para acessar seus arquivos</p>
    </div>
    <form id="form">
      <div class="erro" id="erro"></div>
      <label for="user">Usuário</label>
      <input id="user" name="user" autocomplete="username" required autofocus>
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="btn">Entrar</button>
    </form>
  </div>
<script>
document.getElementById('form').onsubmit = async e => {
  e.preventDefault();
  const btn = document.getElementById('btn'), erro = document.getElementById('erro');
  btn.disabled = true; erro.classList.remove('show');
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: user.value.trim(), password: password.value })
    });
    if (r.ok) return location.href = '/';
    erro.textContent = (await r.json()).error || 'Erro ao entrar';
  } catch { erro.textContent = 'Erro de conexão'; }
  erro.classList.add('show'); btn.disabled = false;
};
</script>
</body>
</html>
