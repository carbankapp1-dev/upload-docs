<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus Arquivos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #46da86;
    --verde-hover: #35c473;
    --azul: #111741;
    --azul-escuro: #142037;
    --fundo: #f4f6f9;
    --branco: #ffffff;
    --borda: #e3e7ee;
    --texto-suave: #6b7489;
    --perigo: #e5484d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', sans-serif;
    background: var(--fundo);
    color: var(--azul-escuro);
    min-height: 100vh;
  }

  header {
    background: var(--azul-escuro);
    color: #fff;
    padding: 18px 24px;
  }
  .header-inner { max-width: 1000px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 38px; height: 38px; border-radius: 10px; background: var(--verde);
    display: grid; place-items: center; color: var(--azul); flex-shrink: 0;
  }
  header h1 { font-size: 1.25rem; font-weight: 600; }
  header h1 span { color: var(--verde); }
  .user-box { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: .9rem; }
  #userName { color: #aab3c8; }
  .btn-sair {
    font-family: inherit; font-size: .85rem; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
    background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 8px; padding: 7px 12px; cursor: pointer; transition: .15s;
  }
  .btn-sair:hover { border-color: var(--verde); color: var(--verde); }
  @media (max-width: 560px) { #userName { display: none; } }

  main { max-width: 1000px; margin: 0 auto; padding: 28px 16px 60px; }

  .card {
    background: var(--branco);
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(17, 23, 65, .06);
    padding: 24px;
    margin-bottom: 24px;
  }

  /* Upload */
  .dropzone {
    border: 2px dashed #c9d1de;
    border-radius: 14px;
    padding: 36px 20px;
    text-align: center;
    transition: .2s;
  }
  .dropzone.over { border-color: var(--verde); background: rgba(70, 218, 134, .08); }
  .dropzone > svg { color: var(--verde); margin-bottom: 8px; }
  .dropzone h2 { font-size: 1.1rem; color: var(--azul); font-weight: 600; }
  .dropzone p { color: var(--texto-suave); font-size: .9rem; margin: 4px 0 18px; }
  .aviso { font-size: .8rem !important; color: var(--azul) !important; background: rgba(70, 218, 134, .12); display: inline-block; padding: 4px 12px; border-radius: 99px; margin-top: -8px !important; }
  .aviso[hidden] { display: none; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  .btn {
    font-family: inherit; font-size: .9rem; font-weight: 500;
    border: none; border-radius: 10px; padding: 11px 20px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; transition: .15s;
  }
  .btn-verde { background: var(--verde); color: var(--azul); }
  .btn-verde:hover { background: var(--verde-hover); }
  .btn-azul { background: var(--azul); color: #fff; }
  .btn-azul:hover { background: var(--azul-escuro); }
  .btn-claro { background: var(--fundo); color: var(--azul); border: 1px solid var(--borda); }
  .btn-claro:hover { border-color: var(--azul); }
  input[type=file] { display: none; }

  .progress { margin-top: 18px; display: none; }
  .progress.show { display: block; }
  .progress-info { display: flex; justify-content: space-between; font-size: .85rem; margin-bottom: 6px; color: var(--texto-suave); }
  .bar { height: 10px; background: var(--fundo); border-radius: 99px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: var(--verde); transition: width .15s; }

  /* Lista */
  .list-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .breadcrumb { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; font-weight: 500; }
  .breadcrumb a { color: var(--azul); text-decoration: none; padding: 2px 6px; border-radius: 6px; cursor: pointer; }
  .breadcrumb a:hover { background: var(--fundo); }
  .breadcrumb a:last-child { color: var(--verde-hover); }
  .breadcrumb .sep { color: #b4bccb; }

  .file-list { list-style: none; }
  .file-row {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 10px; border-bottom: 1px solid var(--borda);
  }
  .file-row:last-child { border-bottom: none; }
  .file-row:hover { background: #fafbfd; }
  .icon {
    width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0;
    background: rgba(17, 23, 65, .07); color: var(--azul);
  }
  .icon.dir { background: rgba(70, 218, 134, .15); color: #23a85c; }
  .file-info { flex: 1; min-width: 0; }
  .file-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-name.clickable { cursor: pointer; }
  .file-name.clickable:hover { color: var(--verde-hover); }
  .file-meta { font-size: .78rem; color: var(--texto-suave); }
  .actions { display: flex; gap: 6px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--borda);
    background: #fff; color: var(--azul); cursor: pointer; display: grid; place-items: center; transition: .15s;
  }
  .icon-btn:hover { background: var(--verde); border-color: var(--verde); }
  .icon-btn.del:hover { background: var(--perigo); border-color: var(--perigo); color: #fff; }

  .empty { text-align: center; padding: 40px 10px; color: var(--texto-suave); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--azul); color: #fff; padding: 12px 22px; border-radius: 10px;
    font-size: .9rem; transition: .3s; z-index: 10; border-left: 4px solid var(--verde);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 560px) {
    .card { padding: 16px; }
    .file-row { gap: 10px; padding: 10px 4px; }
    .icon { width: 34px; height: 34px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </div>
    <h1>Meus <span>Arquivos</span></h1>
    <div class="user-box">
      <span id="userName"></span>
      <button class="btn-sair" onclick="logout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sair
      </button>
    </div>
  </div>
</header>

<main>
  <section class="card">
    <div class="dropzone" id="dropzone">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>
      <h2>Arraste arquivos ou pastas aqui</h2>
      <p>ou escolha abaixo — serão enviados para a pasta atual (máx. <span id="maxMb">50</span> MB por arquivo)</p>
      <p class="aviso" id="aviso" hidden></p>
      <div class="btns">
        <button class="btn btn-verde" onclick="fileInput.click()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Enviar arquivos
        </button>
        <button class="btn btn-azul" onclick="folderInput.click()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          Enviar pasta
        </button>
      </div>
      <input type="file" id="fileInput" multiple>
      <input type="file" id="folderInput" webkitdirectory directory multiple>
    </div>

    <div class="progress" id="progress">
      <div class="progress-info"><span id="progressText">Enviando...</span><span id="progressPct">0%</span></div>
      <div class="bar"><div id="progressBar"></div></div>
    </div>
  </section>

  <section class="card">
    <div class="list-head">
      <nav class="breadcrumb" id="breadcrumb"></nav>
      <button class="btn btn-claro" onclick="newFolder()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
        Nova pasta
      </button>
    </div>
    <ul class="file-list" id="fileList"></ul>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const ICONS = {
  folder: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>',
  file: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
  download: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  trash: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>'
};

let currentDir = '';
const $ = id => document.getElementById(id);
const fileInput = $('fileInput'), folderInput = $('folderInput');

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2800);
}
function fmtSize(b) {
  if (b < 1024) return b + ' B';
  const u = ['KB', 'MB', 'GB', 'TB']; let i = -1;
  do { b /= 1024; i++; } while (b >= 1024 && i < u.length - 1);
  return b.toFixed(b < 10 ? 1 : 0) + ' ' + u[i];
}
function fmtDate(ms) {
  return new Date(ms).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
}
function esc(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function join(a, b) { return a ? a + '/' + b : b; }

/* ---------- Sessão ---------- */
async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/login.html';
}
fetch('/api/me').then(r => r.ok ? r.json() : (location.href = '/login.html'))
  .then(d => {
    if (!d) return;
    $('userName').textContent = 'Olá, ' + d.user;
    if (d.maxFileMb) { maxFileMb = d.maxFileMb; $("maxMb").textContent = d.maxFileMb; }
    if (d.cleanupDays > 0) {
      $('aviso').textContent = `Os arquivos são apagados automaticamente após ${d.cleanupDays} dia(s)`;
      $('aviso').hidden = false;
    }
  });

/* ---------- Listagem ---------- */
async function load(dir = currentDir) {
  const r = await fetch('/api/list?dir=' + encodeURIComponent(dir));
  if (r.status === 401) return location.href = '/login.html';
  if (!r.ok) { currentDir = ''; return load(''); }
  const data = await r.json();
  currentDir = data.dir;
  renderBreadcrumb();
  const list = $('fileList');
  if (!data.items.length) {
    list.innerHTML = '<li class="empty">Nenhum arquivo aqui ainda.<br>Envie arquivos ou pastas acima.</li>';
    return;
  }
  list.innerHTML = data.items.map(it => {
    const p = esc(join(currentDir, it.name));
    return `<li class="file-row">
      <div class="icon ${it.isDir ? 'dir' : ''}">${it.isDir ? ICONS.folder : ICONS.file}</div>
      <div class="file-info">
        <div class="file-name ${it.isDir ? 'clickable' : ''}" ${it.isDir ? `data-open="${p}"` : ''} title="${esc(it.name)}">${esc(it.name)}</div>
        <div class="file-meta">${it.isDir ? 'Pasta' : fmtSize(it.size) + ' · ' + fmtDate(it.mtime)}</div>
      </div>
      <div class="actions">
        <button class="icon-btn" title="${it.isDir ? 'Baixar pasta (.zip)' : 'Baixar'}" data-dl="${p}">${ICONS.download}</button>
        <button class="icon-btn del" title="Excluir" data-del="${p}">${ICONS.trash}</button>
      </div>
    </li>`;
  }).join('');
}

function renderBreadcrumb() {
  const parts = currentDir ? currentDir.split('/') : [];
  let html = '<a data-open="">Início</a>', acc = '';
  parts.forEach(p => { acc = join(acc, p); html += `<span class="sep">/</span><a data-open="${esc(acc)}">${esc(p)}</a>`; });
  $('breadcrumb').innerHTML = html;
}

document.addEventListener('click', async e => {
  const open = e.target.closest('[data-open]');
  if (open) return load(open.dataset.open);
  const dl = e.target.closest('[data-dl]');
  if (dl) { window.location = '/api/download?path=' + encodeURIComponent(dl.dataset.dl); return; }
  const del = e.target.closest('[data-del]');
  if (del) {
    const name = del.dataset.del.split('/').pop();
    if (!confirm(`Excluir "${name}"? Essa ação não pode ser desfeita.`)) return;
    await fetch('/api/delete?path=' + encodeURIComponent(del.dataset.del), { method: 'DELETE' });
    toast('Excluído com sucesso');
    load();
  }
});

async function newFolder() {
  const name = prompt('Nome da nova pasta:');
  if (!name || !name.trim()) return;
  await fetch('/api/mkdir?path=' + encodeURIComponent(join(currentDir, name.trim())), { method: 'POST' });
  load();
}

/* ---------- Upload ---------- */
// items: [{ file, path }]
let maxFileMb = 50;
function uploadItems(items) {
  const big = items.filter(i => i.file.size > maxFileMb * 1024 * 1024);
  items = items.filter(i => i.file.size <= maxFileMb * 1024 * 1024);
  if (big.length) alert(`Estes arquivos passam do limite de ${maxFileMb} MB e não serão enviados:\n\n` + big.map(i => '• ' + i.path).join('\n'));
  if (!items.length) return;
  const fd = new FormData();
  items.forEach(({ file, path }) => { fd.append('paths', path); fd.append('files', file); });

  const total = items.reduce((s, i) => s + i.file.size, 0);
  $('progress').classList.add('show');
  $('progressText').textContent = `Enviando ${items.length} arquivo(s) · ${fmtSize(total)}`;

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload?dir=' + encodeURIComponent(currentDir));
  xhr.upload.onprogress = e => {
    if (!e.lengthComputable) return;
    const pct = Math.round(e.loaded / e.total * 100);
    $('progressBar').style.width = pct + '%';
    $('progressPct').textContent = pct + '%';
  };
  xhr.onload = () => {
    $('progress').classList.remove('show');
    $('progressBar').style.width = '0';
    let r = {}; try { r = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status !== 200) toast('Erro no envio');
    else if (r.failed && r.failed.length) {
      toast(`${r.count} enviado(s), ${r.failed.length} com erro`);
      alert('Não foi possível enviar:\n\n' + r.failed.map(f => '• ' + f).join('\n'));
    } else toast(`${r.count} arquivo(s) enviado(s)!`);
    load();
  };
  xhr.onerror = () => { $('progress').classList.remove('show'); toast('Erro de conexão'); };
  xhr.send(fd);
}

fileInput.onchange = () => {
  uploadItems([...fileInput.files].map(f => ({ file: f, path: f.name })));
  fileInput.value = '';
};
folderInput.onchange = () => {
  uploadItems([...folderInput.files].map(f => ({ file: f, path: f.webkitRelativePath || f.name })));
  folderInput.value = '';
};

/* Arrastar e soltar (inclui pastas) */
const dz = $('dropzone');
['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
dz.addEventListener('drop', async e => {
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (!entries.length) return uploadItems([...e.dataTransfer.files].map(f => ({ file: f, path: f.name })));
  const out = [];
  for (const en of entries) await walk(en, '', out);
  uploadItems(out);
});

function walk(entry, prefix, out) {
  return new Promise(resolve => {
    if (entry.isFile) {
      entry.file(f => { out.push({ file: f, path: prefix + f.name }); resolve(); }, resolve);
    } else if (entry.isDirectory) {
      const reader = entry.createReader(), all = [];
      const read = () => reader.readEntries(async batch => {
        if (batch.length) { all.push(...batch); read(); }
        else { for (const c of all) await walk(c, prefix + entry.name + '/', out); resolve(); }
      }, resolve);
      read();
    } else resolve();
  });
}

load();
</script>
</body>
</html>
